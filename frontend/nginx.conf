#######################################
# HTTP 80 포트 → HTTPS 리다이렉트
#######################################
server {
    listen 80;
    server_name jpkaresearch.store www.jpkaresearch.store;

    # Let's Encrypt 인증 경로
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$server_name$request_uri;
    }
}

#######################################
# HTTPS 443 포트
#######################################
server {
    listen 443 ssl http2;
    server_name jpkaresearch.store www.jpkaresearch.store;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/jpkaresearch.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jpkaresearch.store/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    ###################################
    # 🔥 Spring Backend API
    ###################################
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_request_buffering off;
        client_max_body_size 20M;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    ###################################
    # 🔥 React Frontend (SPA)
    ###################################
    location / {
        try_files $uri /index.html;
    }
}