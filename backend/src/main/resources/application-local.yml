spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ecprice?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1111

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # ✅ dialect 설정은 지워도 됨(경고 떴던거 기억나지)

# ===== 외부 키들은 로컬에서도 환경변수로만 받게 통일 =====
openai:
  api:
    key: ${OPENAI_API_KEY:}
    model: ${OPENAI_API_MODEL:gpt-4o-mini}

naver:
  client:
    id: ${NAVER_CLIENT_ID:}
    secret: ${NAVER_CLIENT_SECRET:}

coupang:
  accessKey: ${COUPANG_ACCESS_KEY:}
  secretKey: ${COUPANG_SECRET_KEY:}

rakuten:
  api:
    key: ${RAKUTEN_API_KEY:}
    secret: ${RAKUTEN_AFFILIATE_ID:}
    affiliate: ${RAKUTEN_AFFILIATE_ID:}
    apiUrl: "https://app.rakuten.co.jp/services/api/IchibaItem/Search/20220601"

scraperapi:
  api:
    key: ${SCRAPER_API_KEY:}

exchange:
  api:
    key: ${EXCHANGE_API_KEY:}
  url:
    live: "https://api.exchangerate.host/live"
    convert: "https://api.exchangerate.host/convert"
    list: "https://api.exchangerate.host/list"
    historical: "https://api.exchangerate.host/historical"

jwt:
  secret: ${JWT_SECRET:dev-secret}
  expiration: ${JWT_EXPIRATION:3600000}
  issuer: ecprice-research

google:
  oauth:
    clientId: ${GOOGLE_OAUTH_CLIENT_ID:}
    clientSecret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirectUri: "http://localhost:8080/login/oauth2/code/google"
    scope:
      - profile
      - email
cors:
  allowed-origins: http://localhost:5174,https://jpkaresearch.store