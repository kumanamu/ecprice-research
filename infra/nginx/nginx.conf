#######################################
# HTTP → HTTPS
#######################################
server {
    listen 80;
    server_name jpkaresearch.store www.jpkaresearch.store;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

#######################################
# HTTPS
#######################################
server {
    listen 443 ssl http2;
    server_name jpkaresearch.store www.jpkaresearch.store;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/jpkaresearch.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jpkaresearch.store/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    ###################################
    # 🔥 Spring Backend API
    ###################################
    location /api/ {
        proxy_pass http://backend:8080;   # ⭐ /api 유지 핵심
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # JWT / SSE 안정화
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    ###################################
    # 🔥 React SPA
    ###################################
    location / {
        try_files $uri /index.html;
    }
}
