version: "3.9"

services:
  frontend:
    image: ghcr.io/kumanamu/ecprice-frontend:latest
    container_name: ecprice-frontend
    restart: always
    expose:
      - "80"

  backend:
    image: ghcr.io/kumanamu/ecprice-backend:latest
    container_name: ecprice-backend
    restart: always
    env_file:
      - .env.prod
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: ecprice-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
