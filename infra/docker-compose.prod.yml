version: "3.9"

services:
  backend:
    image: ghcr.io/kumanamu/ecprice-backend:latest
    container_name: ecprice-backend
    restart: always
    env_file:
      - .env.prod
    expose:
      - "8080"

  frontend:
    image: ghcr.io/kumanamu/ecprice-frontend:latest
    container_name: ecprice-frontend
    restart: always
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: ecprice-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: ecprice-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h;
      done
      "
