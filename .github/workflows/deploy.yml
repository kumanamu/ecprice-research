name: Deploy ECPrice

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ===============================
      # 1️⃣ Checkout
      # ===============================
      - name: Checkout
        uses: actions/checkout@v4

      # ===============================
      # 2️⃣ Login to GHCR
      # ===============================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ===============================
      # 3️⃣ Backend Build & Push
      # ===============================
      - name: Build & Push Backend
        run: |
          docker build \
            -t ghcr.io/kumanamu/ecprice-backend:latest \
            ./backend
          docker push ghcr.io/kumanamu/ecprice-backend:latest

      # ===============================
      # 4️⃣ Frontend Build & Push
      # ===============================
      - name: Build & Push Frontend
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.jpkaresearch.store \
            -t ghcr.io/kumanamu/ecprice-frontend:latest \
            ./frontend
          docker push ghcr.io/kumanamu/ecprice-frontend:latest

      # ===============================
      # 5️⃣ Deploy to EC2
      # ===============================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m

          script: |
            set -e
            cd /home/ubuntu/infra

            echo "==============================="
            echo "🔧 Generate .env.prod"
            echo "==============================="

            cat <<EOF > .env.prod
            # ===== Spring =====
            SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}

            # ===== DB =====
            RDS_ENDPOINT=${{ secrets.RDS_ENDPOINT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            # ===== JWT =====
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}

            # ===== OpenAI =====
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_API_MODEL=${{ secrets.OPENAI_API_MODEL }}

            # ===== External APIs =====
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}

            COUPANG_ACCESS_KEY=${{ secrets.COUPANG_ACCESS_KEY }}
            COUPANG_SECRET_KEY=${{ secrets.COUPANG_SECRET_KEY }}

            RAKUTEN_API_KEY=${{ secrets.RAKUTEN_API_KEY }}
            RAKUTEN_API_SECRET=${{ secrets.RAKUTEN_API_SECRET }}
            RAKUTEN_AFFILIATE_ID=${{ secrets.RAKUTEN_AFFILIATE_ID }}

            SCRAPER_API_KEY=${{ secrets.SCRAPER_API_KEY }}
            EXCHANGE_API_KEY=${{ secrets.EXCHANGE_API_KEY }}

            APP_FRONT_REDIRECT_URL=${{ secrets.APP_FRONT_REDIRECT_URL }}
            EOF

            echo "==============================="
            echo "🧹 Cleanup old containers"
            echo "==============================="

            docker compose down --remove-orphans || true
            docker rm -f ecprice-backend ecprice-frontend || true

            echo "==============================="
            echo "🚀 Docker Compose Deploy"
            echo "==============================="

            docker compose pull
            docker compose --env-file .env.prod up -d

            echo "==============================="
            echo "✅ Deploy Finished"
            echo "==============================="
