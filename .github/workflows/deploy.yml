name: Deploy ECPrice

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Backend Build & Push =====
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build -t ghcr.io/kumanamu/ecprice-backend:latest ./backend
          docker push ghcr.io/kumanamu/ecprice-backend:latest

      # ===== Frontend Build & Push =====
      - name: Build & Push Frontend
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.jpkaresearch.store \
            -t ghcr.io/kumanamu/ecprice-frontend:latest ./frontend
          docker push ghcr.io/kumanamu/ecprice-frontend:latest

          # ===== EC2 Deploy =====
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          timeout: 60s            # ✅ SSH 연결 대기 시간
          command_timeout: 30m    # ✅ docker pull / up 실행 시간

          script: |
            cd /home/ubuntu/infra
            docker compose pull
            docker compose up -d

